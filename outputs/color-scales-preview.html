        !object(value) ||
        typeof value.title !== 'string' ||
        !value.title.trim() ||
        value.title.length > 100 ||
        typeof value.description !== 'string' ||
        value.description.length > 8000 ||
        !object(value.stats) ||
        Object.keys(value.stats).length > 100
      )
        throw new Error('Запись должна иметь название, описание и объект статов (до 100 полей).');
      key(value.id);
      for (const stat of Object.keys(value.stats)) key(stat);
      return {
        id: value.id,
        title: value.title.trim(),
        description: value.description,

        kind: key(value.kind || 'note'),

    }
    function treeNodes(nodes, depth = 0, count = { value: 0 }) {
      if (!Array.isArray(nodes) || depth > 32)

      return nodes.map((raw) => {

          !object(raw) ||

/* Isolated UI preview: uses the production model, controls, menus and windows. */

      y: 16,
